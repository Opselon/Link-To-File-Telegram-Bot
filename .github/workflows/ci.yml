name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (pyflakes rules)
        run: ruff check --select E9,F .

      - name: Compile
        run: python -m compileall -q .

      - name: Tests
        run: PYTHONPATH=. pytest -q

      - name: Import smoke test
        run: python -c "import main, bot, downloader, db, ui, queue_manager; print('imports ok')"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: link-to-file:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image smoke test
        run: docker run --rm link-to-file:ci --version
