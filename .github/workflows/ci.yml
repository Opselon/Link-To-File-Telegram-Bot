name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: Pre-test safety checks
      run: python -m compileall -q .

    - name: Run tests
      run: PYTHONPATH=. pytest -q

    - name: Environment smoke test
      run: |
        python -c "import main, bot, downloader, db; print('Smoke test: imports successful')"

    - name: Lightweight linting
      run: find . -name "*.py" -not -path "*/.*" -exec python -m py_compile {} +
